services:
  postgres:
    image: postgres:16-alpine
    container_name: crewsense-postgres
    environment:
      POSTGRES_USER: crewsense
      POSTGRES_PASSWORD: crewsense
      POSTGRES_DB: crewsense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewsense"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: crewsense-neo4j
    environment:
      NEO4J_AUTH: neo4j/crewsense
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  neo4jdata:
